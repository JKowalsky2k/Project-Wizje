</head>
  <body>
    <header class="site-header">
      <a class="logo-link" href="#start" aria-label="Wizje — Home" data-i18n-aria-label="homeLabel">
        <span class="site-logo" aria-hidden="true"><span class="logo-letter logo-letter--z">w</span><span class="logo-letter logo-letter--w">i</span><span class="logo-letter logo-letter--i">z</span><span class="logo-letter logo-letter--d">j</span><span class="logo-letter logo-letter--y">e</span></span>
      </a>
      <p class="header-note" data-i18n="headerNote">Photography · posters · prints</p>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Use light theme" aria-pressed="false">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z"/></svg>
        </button>
        <nav class="language-switch" aria-label="Choose language" data-i18n-aria-label="languageLabel">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="pl" aria-pressed="false">PL</button>
        </nav>
      </div>
    </header>

    <main id="start">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">
          <span class="intro__line" data-i18n="headlineFirst">Images worth</span>
          <span class="intro__line intro__line--accent" data-i18n="headlineSecond">keeping</span>
        </h1>
      </section>

      <section id="photo-globe" class="photo-globe" aria-label="Photo locations" data-i18n-aria-label="globeLabel">
        <div class="photo-globe__viewport">
          <svg viewBox="0 -50 900 400" role="group" aria-label="Globe with country outlines and approximate photo locations" data-i18n-aria-label="globeMapLabel"></svg>
        </div>
        <p class="photo-globe__caption" data-i18n="globeCaption">Places behind the photographs</p>
        <nav class="photo-globe__places" aria-label="Choose a location" data-i18n-aria-label="globeChoose"></nav>
        <p class="photo-globe__empty" data-i18n="globeEmpty" hidden>No locations assigned yet.</p>
        <p class="photo-globe__note" data-i18n="globeNote">Approximate locations</p>
        <p class="photo-globe__status sr-only" role="status" aria-live="polite"></p>
      </section>

      <section class="collections" aria-labelledby="collections-title">
        <div class="year-picker" role="group" aria-label="Collection year" data-i18n-aria-label="yearLabel">
          <button id="year-up" class="year-picker__arrow" type="button" aria-label="Newer year" data-i18n-aria-label="yearUp"><span aria-hidden="true">↑</span></button>
          <div id="year-wheel" class="year-wheel" aria-hidden="true"></div>
          <button id="year-down" class="year-picker__arrow" type="button" aria-label="Older year" data-i18n-aria-label="yearDown"><span aria-hidden="true">↓</span></button>
        </div>
        <p id="year-status" class="sr-only" role="status" aria-live="polite"></p>
        <div class="section-heading">
          <h2 id="collections-title" data-i18n="collectionsTitle">Collections</h2>
          <span data-collection-count>01 — 04</span>
        </div>

        <p class="gallery-link"><a href="gallery.html" data-i18n="allPhotos">Browse all photography collections</a></p>

        <div class="collection-filters">
          <label class="collection-filter"><span data-i18n="filterCollection">Collection</span><select id="filter-collection" aria-controls="collection-list"></select></label>
          <label class="collection-filter"><span data-i18n="filterColorMode">Color</span><select id="filter-color-mode" aria-controls="collection-list"><option value="all" data-i18n="filterAll">All</option><option value="color" data-i18n="filterColor">Color</option><option value="monochrome" data-i18n="filterMonochrome">Black &amp; white</option></select></label>
          <fieldset class="orientation-filter"><legend data-i18n="filterOrientation">Orientation</legend><div>
            <label><input type="radio" name="filter-orientation" value="all" checked><span data-i18n="filterAll">All</span></label>
            <label><input type="radio" name="filter-orientation" value="portrait" data-i18n-aria-label="filterPortrait" aria-label="Portrait"><span class="filter-frame filter-frame--portrait" aria-hidden="true"></span></label>
            <label><input type="radio" name="filter-orientation" value="landscape" data-i18n-aria-label="filterLandscape" aria-label="Landscape"><span class="filter-frame filter-frame--landscape" aria-hidden="true"></span></label>
          </div></fieldset>
          <div class="filter-reset-row"><button id="filter-reset" type="button" aria-controls="collection-list" data-i18n="filterReset" disabled>Reset filters</button></div>
        </div>
        <p id="filter-status" class="sr-only" role="status" aria-live="polite"></p>
        <p id="year-empty" class="year-empty" data-i18n="filterEmpty" hidden>No photos match these filters.</p>
        <div id="collection-list"></div>
        <noscript><p>View the <a href="gallery.html">complete photography gallery</a> without JavaScript.</p></noscript>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footerNote">Original photography</span>
      <span>© 2026</span>
    </footer>
  </body>
</html>
